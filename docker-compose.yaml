name: airflow

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-meta:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./spark/jobs:/opt/airflow/spark/jobs
    - ./scripts:/opt/airflow/scripts

  user: "50000:0"

  depends_on:
    postgres-meta:
      condition: service_healthy


services:

  # =========================================================
  # PostgreSQL INTERNE À AIRFLOW
  # =========================================================

  postgres-meta:

    image: postgres:13

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]

      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  # =========================================================
  # POSTGRESQL SOURCE (base scolaire "school")
  # =========================================================
  postgres-source:

    image: postgres:13

    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school

    ports:
      - "5433:5432"   # Accès depuis l'hôte (5432 est déjà pris par le Postgres local)

    volumes:
      - ./data:/docker-entrypoint-initdb.d:ro
      - postgres-source-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school"]

      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    # =========================================================
  # MONGODB (Data Warehouse)
  # =========================================================
  mongodb-dwh:

    image: mongo:7

    ports:
      - "27018:27017" # 27017 est déjà pris par le MongoDB local

    volumes:
      - mongodb-dwh-volume:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]

      # mongosh (Node) est lent à démarrer : on lui laisse le temps
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

    restart: unless-stopped

    # =========================================================
  # SPARK MASTER
  # =========================================================
  spark-master:
    image: apache/spark:3.5.0
    # NB : dans l'image apache/spark, les scripts sont dans /opt/spark/bin
    # (et non /opt/spark/sbin comme dans la distribution binaire officielle).
    # On lance le processus au premier plan (pas de daemon) pour Docker.
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "8081:8080" # Interface Web Spark (master)
      - "7077:7077" # Port Master pour Airflow
    healthcheck:
      # /bin/sh est dash dans cette image : /dev/tcp impose bash.
      # On teste le nom d'hote car le master ecoute sur son IP
      # (et non sur 127.0.0.1) pour pouvoir s'annoncer aux workers.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/spark-master/7077"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # =========================================================
  # SPARK WORKER
  # =========================================================
  spark-worker:
    image: apache/spark:3.5.0
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --memory
      - 1g
      - --cores
      - "2"
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 1g
    depends_on:
      spark-master:
        condition: service_healthy
    restart: unless-stopped




  # =========================================================
  # INITIALISATION AIRFLOW
  # =========================================================

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --firstname Admin \
          --lastname Airflow \
          --role Admin \
          --email airflow@example.com \
          --password airflow || true
    restart: "no"


  # =========================================================
  # AIRFLOW WEBSERVER
  # =========================================================

  airflow-webserver:

    <<: *airflow-common

    command: webserver

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/health"
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s # le webserver met ~80s à démarrer

    restart: unless-stopped


  # =========================================================
  # AIRFLOW SCHEDULER
  # =========================================================

  airflow-scheduler:

    <<: *airflow-common

    command: scheduler

    restart: unless-stopped


  # =========================================================
  # PGADMIN (interface web PostgreSQL)
  # =========================================================
  pgadmin:

    image: dpage/pgadmin4:8

    ports:
      - "5050:80"

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"

    volumes:
      - pgadmin-data:/var/lib/pgadmin

    depends_on:
      postgres-source:
        condition: service_healthy

    restart: unless-stopped

  # =========================================================
  # MONGO-EXPRESS (interface web MongoDB)
  # =========================================================
  mongo-express:

    image: mongo-express:1.0.2

    ports:
      - "8082:8081" # 8081 est déjà pris par l'UI Spark

    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb-dwh
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_URL: mongodb://mongodb-dwh:27017/dwh_airflow
      ME_CONFIG_BASICAUTH: "false" # pas de login demandé

    depends_on:
      mongodb-dwh:
        condition: service_healthy

    restart: unless-stopped


# ===========================================================
# VOLUMES
# ===========================================================

volumes:

  postgres-db-volume:
  postgres-source-volume:
  mongodb-dwh-volume:
  pgadmin-data: